spring.application.name=unfpg-microservicio-academico

#definir el puerto de la aplicacion
server.port=9094
#url del proyecto
server.servlet.context-path=/unfpg
#cadena de conexion
spring.datasource.url=jdbc:mysql://localhost:3306/universidad_unfpg
#usuario de la bd
spring.datasource.username=root
#clave de la bd
spring.datasource.password=root
#driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

